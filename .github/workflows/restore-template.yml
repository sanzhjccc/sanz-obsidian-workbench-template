name: Restore template from package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace repository with packaged template
        run: |
          package='Sanz-Obsidian-工作台模板-v1.0.0.zip'
          temp_dir="$(mktemp -d)"
          unzip -q "$package" -d "$temp_dir"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name "$package" -exec rm -rf {} +
          cp -a "$temp_dir"/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore template contents from package' || exit 0
          git push
